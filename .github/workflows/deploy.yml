name: Deploy Demos to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Elle tetikleme butonu

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install jinja2

      - name: Generate demo pages
        run: python demo_generator.py
        env:
          BASE_DEMO_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/demos"
          PURCHASE_URL: "https://satin-al.webfabrika.com.tr"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './demos'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
